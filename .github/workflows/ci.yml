name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy src app.py
      - run: python -m pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flightdesk-ai:ci .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name fd -p 8501:8501 -e FLIGHTDESK_OWNER_USERNAME=ci -e FLIGHTDESK_OWNER_PASSWORD=ci-password-123 flightdesk-ai:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8501/_stcore/health && exit 0; sleep 2; done
          docker logs fd; exit 1
